<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Tailoring Agent</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f7f7f8;
    --text: #1a1a1a;
    --text-muted: #666666;
    --border: #e2e2e4;
    --accent: #7c3aed;
    --accent-soft: #f3ebfd;
    --good: #16a34a;
    --good-bg: #ecfdf3;
    --weak: #d97706;
    --weak-bg: #fef6e7;
    --missing: #dc2626;
    --missing-bg: #fdeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --bg-alt: #1b1b1e;
      --text: #ececec;
      --text-muted: #9a9a9e;
      --border: #2c2c30;
      --accent: #a78bfa;
      --accent-soft: #241a35;
      --good: #4ade80;
      --good-bg: #10241a;
      --weak: #fbbf24;
      --weak-bg: #2b2110;
      --missing: #f87171;
      --missing-bg: #2b1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .sub { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
  .card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; }
  textarea, input[type="password"] {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-family: inherit;
    font-size: 0.9rem;
    resize: vertical;
  }
  textarea { min-height: 140px; }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .key-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
  .estimate {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 1.25rem;
    font-size: 0.9rem;
  }
  .estimate strong { color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.75rem; min-height: 1.2em; }
  .steps { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .step-pill {
    font-size: 0.75rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .step-pill.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .step-pill.done { border-color: var(--good); color: var(--good); }
  .section-title { font-size: 1rem; font-weight: 700; margin: 2rem 0 0.75rem; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
  .tag { font-size: 0.78rem; padding: 0.2rem 0.55rem; border-radius: 6px; }
  .tag.covered { background: var(--good-bg); color: var(--good); }
  .tag.weak { background: var(--weak-bg); color: var(--weak); }
  .tag.missing { background: var(--missing-bg); color: var(--missing); }
  .rewrite-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.9rem;
    background: var(--bg-alt);
  }
  .rewrite-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.2rem; }
  .original { color: var(--text-muted); text-decoration: line-through; font-size: 0.88rem; margin-bottom: 0.5rem; }
  .revised { font-size: 0.92rem; margin-bottom: 0.5rem; }
  .rationale { font-size: 0.82rem; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 0.5rem; }
  .gap-list { font-size: 0.88rem; color: var(--text-muted); }
  .error-box {
    background: var(--missing-bg);
    color: var(--missing);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.88rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Resume Tailoring Agent</h1>
  <p class="sub">A 4-step agentic chain: extract requirements → compare against your resume → suggest truthful rewrites → explain each change.</p>

  <div class="card">
    <div class="field">
      <label for="jobPosting">Job posting</label>
      <textarea id="jobPosting" placeholder="Paste the job posting text here..."></textarea>
    </div>
    <div class="field">
      <label for="resume">Your resume</label>
      <textarea id="resume" placeholder="Paste your resume text here..."></textarea>
    </div>
    <div class="field">
      <label for="apiKey">Anthropic API key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-...">
      <div class="key-note">Used only for this request, sent directly to the serverless function, never stored or logged.</div>
    </div>
  </div>

  <div class="estimate" id="estimateBox">
    Paste both fields above to see a cost estimate.
  </div>

  <button id="runBtn" disabled>Run the chain</button>
  <div class="steps" id="stepsRow"></div>
  <div class="status" id="statusLine"></div>
  <div id="errorBox"></div>

  <div id="results"></div>
</div>

<script>
// ---- Cost estimate (mirrors TokenScope's approach: ~4 chars/token) ----
// Claude Sonnet pricing used here as an approximation for display purposes.
const PRICE_PER_MTOK_INPUT = 3.00;
const PRICE_PER_MTOK_OUTPUT = 15.00;
const CHARS_PER_TOKEN = 4;

const STEP_NAMES = ["Extract", "Compare", "Rewrite", "Explain"];

function estimateTokens(text) {
  return Math.ceil(text.length / CHARS_PER_TOKEN);
}

function updateEstimate() {
  const jp = document.getElementById('jobPosting').value;
  const rs = document.getElementById('resume').value;
  const box = document.getElementById('estimateBox');
  const btn = document.getElementById('runBtn');

  if (!jp.trim() || !rs.trim()) {
    box.textContent = "Paste both fields above to see a cost estimate.";
    btn.disabled = true;
    return;
  }

  // Rough model: 4 chained calls, each re-sending growing context.
  // Step 1 sees job posting. Step 2 sees requirements + resume.
  // Step 3 sees requirements + comparison + resume. Step 4 sees rewrites + requirements.
  const baseIn = estimateTokens(jp) + estimateTokens(rs);
  const estInputTokens = Math.round(baseIn * 2.6); // accounts for repeated context across 4 calls
  const estOutputTokens = 1800; // typical combined output across 4 structured JSON responses

  const inputCost = (estInputTokens / 1_000_000) * PRICE_PER_MTOK_INPUT;
  const outputCost = (estOutputTokens / 1_000_000) * PRICE_PER_MTOK_OUTPUT;
  const total = inputCost + outputCost;

  box.innerHTML = `~<strong>${estInputTokens.toLocaleString()}</strong> input / <strong>${estOutputTokens.toLocaleString()}</strong> output tokens across 4 calls &nbsp;·&nbsp; est. cost <strong>$${total.toFixed(3)}</strong>`;
  btn.disabled = false;
}

document.getElementById('jobPosting').addEventListener('input', updateEstimate);
document.getElementById('resume').addEventListener('input', updateEstimate);
document.getElementById('apiKey').addEventListener('input', updateEstimate);

function renderSteps(activeIndex, doneIndices) {
  const row = document.getElementById('stepsRow');
  row.innerHTML = STEP_NAMES.map((name, i) => {
    let cls = 'step-pill';
    if (doneIndices.includes(i)) cls += ' done';
    else if (i === activeIndex) cls += ' active';
    return `<span class="${cls}">${i + 1}. ${name}</span>`;
  }).join('');
}

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function runChain() {
  const jobPosting = document.getElementById('jobPosting').value;
  const resume = document.getElementById('resume').value;
  const apiKey = document.getElementById('apiKey').value;
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('statusLine');
  const errorBox = document.getElementById('errorBox');
  const results = document.getElementById('results');

  errorBox.innerHTML = '';
  results.innerHTML = '';
  btn.disabled = true;
  status.textContent = 'Running the 4-step chain — this calls the API four times in sequence...';
  renderSteps(0, []);

  try {
    const res = await fetch('/api/resume-tailor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey, jobPosting, resume })
    });

    renderSteps(-1, [0, 1, 2, 3]);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Request failed');
    }

    status.textContent = `Done. Actual usage: ${data.usage.input_tokens.toLocaleString()} input / ${data.usage.output_tokens.toLocaleString()} output tokens.`;
    renderResults(data);
  } catch (err) {
    status.textContent = '';
    errorBox.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderResults(data) {
  const results = document.getElementById('results');
  const { requirements, comparison, rewrites, unresolvable_gaps, rationales } = data;

  let html = '';

  html += `<div class="section-title">Requirements found in the posting</div>`;
  html += `<div class="tag-row">${requirements.must_have_keywords.map(k => `<span class="tag missing" style="background:var(--accent-soft);color:var(--accent)">${escapeHtml(k)}</span>`).join('')}</div>`;

  html += `<div class="section-title">Coverage</div>`;
  html += `<div class="tag-row">`;
  html += comparison.covered.map(k => `<span class="tag covered">✓ ${escapeHtml(k)}</span>`).join('');
  html += comparison.weak.map(w => `<span class="tag weak">~ ${escapeHtml(w.requirement)}</span>`).join('');
  html += comparison.missing.map(k => `<span class="tag missing">✕ ${escapeHtml(k)}</span>`).join('');
  html += `</div>`;

  html += `<div class="section-title">Suggested rewrites</div>`;
  rewrites.forEach(rw => {
    const rationale = rationales.find(r => r.revised === rw.revised);
    html += `<div class="rewrite-card">
      <div class="rewrite-label">Original</div>
      <div class="original">${escapeHtml(rw.original)}</div>
      <div class="rewrite-label">Revised</div>
      <div class="revised">${escapeHtml(rw.revised)}</div>
      ${rationale ? `<div class="rationale">${escapeHtml(rationale.rationale)}</div>` : ''}
    </div>`;
  });

  if (unresolvable_gaps && unresolvable_gaps.length) {
    html += `<div class="section-title">Gaps the agent wouldn't fabricate around</div>`;
    html += `<div class="gap-list">${unresolvable_gaps.map(escapeHtml).join('<br>')}</div>`;
  }

  results.innerHTML = html;
}

document.getElementById('runBtn').addEventListener('click', runChain);
</script>
</body>
</html>

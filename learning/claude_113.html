.nav-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
.btn-next { background: var(--violet-dark); color: white; border: none; border-radius: 12px; padding: 0.75rem 1.75rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.15s; }

.btn-back { background: none; color: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1.25rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }

@media (max-width: 480px) {
  .lesson-card { padding: 1.25rem; }
  header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
}
</style>

        <div>
          <div class="usecase-title">In a workplace setting, governance is a real responsibility</div>
          <div class="usecase-desc">Anthropic itself has been clear that while some oversight tooling exists, organizations rolling out Cowork broadly are responsible for their own governance and controls — this isn't something to assume is fully handled for you.</div>
        </div>
      </div>

      <div class="usecase-card">
        <div class="usecase-icon">✅</div>
        <div>
          <div class="usecase-title">Review results before treating them as final</div>
          <div class="usecase-desc">Especially early on, or for anything consequential — the same "verify before you fully trust" habit from Module 7's discussion of AI reliability.</div>
        </div>
      </div>

      <div class="callout violet">💡 <strong>The mindset that ties it together:</strong> Cowork's power comes from autonomous, real-world file access — which is exactly why the same care that applies to any powerful tool with real consequences applies here too.</div>
    `
  },
  {
    type: 'quiz',
    tag: 'Quick check ✏️',
    emoji: '🤔',
    title: "Putting it together",
    question: "A company wants to roll out Cowork broadly across an entire department without setting up any specific governance, oversight, or usage guidelines, assuming Anthropic's tooling fully covers this. What's the issue?",
    options: [
      "There's no issue — this is exactly how a rollout should work",
      "Anthropic has been explicit that governance and controls at the organizational level remain the responsibility of the company deploying the tool, not something fully handled automatically",
      "Cowork cannot be deployed to more than one person at a time",
      "This is only a concern for companies outside the United States"
    ],
    correct: 1,
    feedback: {
      correct: "Exactly right. 🎯 A broad rollout with no governance plan, assuming the tool handles this on its own, misses an explicit responsibility Anthropic has placed on the deploying organization. This connects directly to Module 9's lesson that successful AI adoption requires real change-management work, not just flipping on access.",
      wrong: "The answer is B. Anthropic has been direct that organizational governance and controls for a broad Cowork rollout are the deploying company's responsibility — assuming this is automatically covered is a real gap, not a safe assumption."
    }
  }
];

function renderProgress() {
  const pct = (currentLesson / (lessons.length - 1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `Lesson ${currentLesson + 1} of ${lessons.length}`;
}

function renderLesson() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  renderProgress();
  if(currentLesson >= lessons.length) { renderScore(); return; }

  const l = lessons[currentLesson];
  const card = document.createElement('div');
  card.className = 'lesson-card active';
  const backBtn = currentLesson > 0 ? '<button class="btn-back" onclick="goBack()">← Back</button>' : '';

  if(l.type === 'lesson') {
    card.innerHTML = `
      <div class="lesson-tag level-tag">${l.tag}</div>
      <span class="lesson-emoji">${l.emoji}</span>
      <div class="lesson-title">${l.title}</div>
      <div class="lesson-body">${l.body}</div>
      <div class="nav-row">${backBtn}<button class="btn-next" onclick="nextLesson()">Next →</button></div>
    `;
  } else if(l.type === 'quiz') {
    const answered = quizAnswered[currentLesson];
    const letters = ['A','B','C','D'];
    const optionsHTML = l.options.map((o, i) => {
      let cls = '';
      if(answered !== undefined) { if(i === l.correct) cls = 'correct'; else if(i === answered) cls = 'wrong'; else cls = 'disabled'; }
      return `<button class="quiz-option ${cls}" onclick="answerQuiz(${i})"><div class="option-letter">${letters[i]}</div>${o}</button>`;
    }).join('');
    const feedbackCls = answered !== undefined ? (answered === l.correct ? 'correct' : 'wrong') : '';
    const feedbackText = answered !== undefined ? (answered === l.correct ? l.feedback.correct : l.feedback.wrong) : '';
    card.innerHTML = `
      <div class="lesson-tag quiz-tag">${l.tag}</div>
      <span class="lesson-emoji">${l.emoji}</span>
      <div class="lesson-title">${l.title}</div>
      <div class="lesson-body"><p>${l.question}</p></div>
      <div class="quiz-options">${optionsHTML}</div>
      <div class="quiz-feedback ${answered!==undefined?'show':''} ${feedbackCls}">${feedbackText}</div>
      <div class="nav-row" id="quiz-nav" style="${answered===undefined?'display:none':''}">${backBtn}<button class="btn-next" onclick="nextLesson()">Next →</button></div>
    `;
  } else if(l.type === 'tryit') {
    card.innerHTML = `
      <div class="lesson-tag tip-tag">${l.tag}</div>
      <span class="lesson-emoji">${l.emoji}</span>
      <div class="lesson-title">${l.title}</div>
      <div class="lesson-body"><p>${l.instruction}</p></div>
      <div class="try-it">
        <div class="try-label">Your explanation</div>
        <textarea class="try-input" id="try-input" rows="5" placeholder="${l.placeholder}"></textarea>
        <button class="try-submit" onclick="submitTryIt()">Submit →</button>
        <div class="try-response" id="try-response"></div>
      </div>
      <div class="nav-row" id="tryit-nav" style="display:none">${backBtn}<button class="btn-next" onclick="nextLesson()">Next →</button></div>
    `;
  }

  main.appendChild(card);
  window.scrollTo(0, 0);
}

function answerQuiz(selected) {
  const l = lessons[currentLesson];
  if(quizAnswered[currentLesson] !== undefined) return;
  quizAnswered[currentLesson] = selected;
  if(selected === l.correct) quizScore++;
  renderLesson();
}

function submitTryIt() {
  const input = document.getElementById('try-input').value.trim();
  if(!input) return;
  const el = document.getElementById('try-response');
  el.textContent = lessons[currentLesson].response;
  el.classList.add('show');
  document.getElementById('tryit-nav').style.display = 'flex';
  document.querySelector('.try-submit').disabled = true;
}

function nextLesson() { currentLesson++; renderLesson(); }
function goBack() { if(currentLesson > 0) { currentLesson--; renderLesson(); } }

function renderScore() {
  const main = document.getElementById('main');
  const quizCount = Object.keys(quizAnswered).length;
  const pct = quizCount > 0 ? Math.round((quizScore / quizCount) * 100) : 0;
  let emoji, title, sub;
  if(pct === 100) { emoji = '🤝'; title = "You understand Cowork end to end."; sub = "You now know what it is, how the permission model works, and how to use it responsibly — a genuinely practical, real-world skill as agentic tools spread beyond developers."; }
  else if(pct >= 66) { emoji = '🎉'; title = "Solid grasp!"; sub = "You've got the core ideas of the permission model and honest risks. A second pass will lock in anything that didn't fully click."; }
  else { emoji = '💪'; title = "Keep digging!"; sub = "This module connects closely to Modules 5, 9, and 12 — revisiting those alongside this one may help things click."; }

  const card = document.createElement('div');
  card.className = 'lesson-card active';
  card.innerHTML = `
    <div class="score-card">
      <div class="score-emoji">${emoji}</div>
      <div class="score-title">${title}</div>
      <div class="score-sub">${sub}</div>
      <div class="score-badge">Quiz score: ${quizScore} / ${quizCount} correct</div>
      <br>
      <div class="lesson-body" style="text-align:left;margin-bottom:1.5rem">
        <div class="callout violet">
          <strong>What you now know:</strong><br><br>
          🎯 <strong>What Cowork is</strong> — autonomous, multi-step execution for everyday knowledge work, no code required<br>
          📁 <strong>The permission model</strong> — scoped folder access, not unlimited system access<br>
          🧩 <strong>Real use cases</strong> — file-based, multi-step, outcome-focused tasks<br>
          ⚠️ <strong>Honest risks</strong> — real write access means real, sometimes hard-to-reverse consequences<br>
          🛡️ <strong>Using it well</strong> — backups, narrow scoping, and organizational governance as genuine responsibilities
        </div>
        <div class="callout cyan">
          <strong>The one rule that ties it all together:</strong><br>
          Cowork's power and its risk come from the same place — real autonomous access to real files. Treat that access with the same care you'd give any capable coworker handling something important.
        </div>
      </div>
      <button class="restart-btn" onclick="restartModule()">Start over 🔄</button> <a class="back-to-hub-btn" href="claude_learn.html">← Back to Learn Claude</a>
    </div>
  `;
  main.appendChild(card);
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = 'Complete! 🎉';
  window.scrollTo(0, 0);
}

function restartModule() {
  currentLesson = 0; quizScore = 0; quizAnswered = {};
  renderLesson();
}

renderLesson();
</script>
</body>
</html>
